name: Godot headless tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  headless:
    name: ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            archive: Godot_v4.7.2-stable_linux.x86_64.zip
            binary: Godot_v4.7.2-stable_linux.x86_64
          - os: windows-latest
            os_name: Windows
            archive: Godot_v4.7.2-stable_win64.exe.zip
            binary: Godot_v4.7.2-stable_win64_console.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.os }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${{ matrix.archive }}"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"

      - name: Run headless checks
        working-directory: godot
        run: |
          G="$RUNNER_TEMP/godot/${{ matrix.binary }}"
          chmod +x "$G" || true
          GODOT="$G" bash tests/run_ci.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os_name }}
          path: |
            godot/check_*.log
            godot/import.log
          if-no-files-found: ignore
